# Local-only translation engine. Never expose port 5000 to the public Internet.
# Models are downloaded at initial setup and persist in the named volume.
services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      LT_HOST: "0.0.0.0"
      LT_PORT: "5000"
      LT_LOAD_ONLY: "en,he"
      LT_THREADS: "4"
      LT_DISABLE_WEB_UI: "true"
      LT_DISABLE_FILES_TRANSLATION: "true"
    volumes:
      - libretranslate_models:/home/libretranslate/.local:rw
volumes:
  libretranslate_models:
