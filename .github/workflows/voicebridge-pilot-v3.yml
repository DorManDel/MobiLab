name: VoiceBridge Progressive Interim Translation Pilot v3
on:
  push:
    branches:
      - preview/voicebridge-core-pilot-incremental-v3
    paths:
      - 'previews/voicebridge-core-pilot/**'
      - '.github/workflows/voicebridge-pilot-v3.yml'
  pull_request:
    paths:
      - 'previews/voicebridge-core-pilot/**'
      - '.github/workflows/voicebridge-pilot-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progressive-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test stable interim planner
        run: node previews/voicebridge-core-pilot/stable-interim.test.mjs
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run phone-size streaming translation regression
        run: node previews/voicebridge-core-pilot/browser-smoke.mjs
