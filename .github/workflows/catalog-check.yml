name: MobiLab catalog checks

on:
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "src/app.js"
      - "src/lab-catalog.mjs"
      - "tests/lab-catalog.test.mjs"
      - ".github/workflows/catalog-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure engine and HTML contract tests
        run: node --test tests/lab-catalog.test.mjs
      - name: Browser module syntax
        run: |
          node --check src/lab-catalog.mjs
          node --input-type=module --check < src/app.js
